[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comp70049-assignment"
version = "0.1.0"
description = "Self-contained notebooks for the COMP70049 Machine Learning in Cyber assignment"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
deep = ["torch>=2.5,<3"]
